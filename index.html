<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Archiwum 13 SAS — J28</title>
  <meta name="description" content="Cyfrowe archiwum rodu Baczyńskich herbu Sas. Dokumenty pamiętają więcej niż oficjalna historia." />
  <meta name="theme-color" content="#080b0c" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#080b0c;--bg2:#0e1315;--panel:#12181b;--line:#2a2420;--gold:#c9a46a;--gold2:#e8d5a3;--ink:#e8e2d6;--muted:#8b8476;--red:#c45b5b;--ok:#7d9a6f}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif}
    body{min-height:100dvh}
    a{color:var(--gold);text-decoration:none}
    button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
    .app{display:grid;grid-template-columns:220px 1fr;min-height:100dvh}
    .side{border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px;background:#07090a;position:sticky;top:0;height:100dvh}
    .brand{display:flex;gap:10px;align-items:center}
    .mark{width:36px;height:36px;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold)}
    .brand small{display:block;letter-spacing:.18em;font-size:9px;color:var(--muted)}
    .brand b{font-family:"Cormorant Garamond",serif;font-size:22px;color:var(--gold2)}
    nav{display:flex;flex-direction:column;gap:4px}
    nav button{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border:1px solid transparent;text-align:left;color:var(--muted)}
    nav button small{font-size:10px;letter-spacing:.12em}
    nav button.active,nav button:hover{border-color:var(--gold);color:var(--gold2);background:#16110c}
    .lock{margin-top:auto;border:1px solid var(--line);padding:10px;font-size:11px;color:var(--muted)}
    .lock b{display:block;color:var(--ok);letter-spacing:.12em;font-size:10px;margin-bottom:4px}
    .main{padding:18px 22px 40px;min-width:0}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
    .top h1{font-family:"Cormorant Garamond",serif;font-size:34px;font-weight:500}
    .online{font-size:11px;color:var(--ok);letter-spacing:.14em}
    .grid-hero{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.2fr);gap:16px}
    .card{border:1px solid var(--line);background:var(--panel);padding:16px}
    .scan{min-height:420px;background:linear-gradient(180deg,rgba(8,11,12,.15),rgba(8,11,12,.55)),repeating-linear-gradient(0deg,#d8c9a4 0 28px,#d2c09a 28px 29px);color:#2a2116;padding:18px 16px;font-family:"Cormorant Garamond",serif;position:relative}
    .scan .badge{position:absolute;left:10px;bottom:10px;background:#1b140c;color:var(--gold);font-family:"IBM Plex Sans",sans-serif;font-size:10px;padding:4px 7px;letter-spacing:.08em}
    .scan h3{text-align:center;font-size:28px;letter-spacing:.16em}
    .scan p{font-size:15px;line-height:1.45}
    .kicker{font-size:11px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
    h2.display{font-family:"Cormorant Garamond",serif;font-size:clamp(32px,6vw,58px);line-height:.95;color:var(--gold2);margin:8px 0 12px}
    .muted{color:var(--muted);font-size:14px;line-height:1.55}
    .sbox{border:1px solid #5a2d2d;background:#1a1010;padding:10px 12px;margin:14px 0;font-size:13px}
    .sbox b{color:var(--red);letter-spacing:.1em;font-size:11px}
    .kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin:14px 0}
    .kv div{background:var(--bg2);padding:10px 12px}
    .kv small{display:block;color:var(--muted);font-size:10px;letter-spacing:.12em;margin-bottom:4px}
    .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
    .stat{border:1px solid var(--line);padding:12px;background:var(--bg2)}
    .stat b{display:block;font-family:"Cormorant Garamond",serif;font-size:32px;color:var(--gold);line-height:1}
    .stat.s b{color:var(--red)}
    .stat small{color:var(--muted);font-size:11px}
    .timeline{display:flex;flex-direction:column;gap:10px}
    .item{border:1px solid var(--line);padding:12px;background:var(--bg2)}
    .item .meta{font-size:11px;color:var(--gold);letter-spacing:.08em;margin-bottom:4px}
    .item h3{font-size:16px;margin-bottom:4px}
    .item p{font-size:13px;color:var(--muted);line-height:1.5}
    .tag{display:inline-block;border:1px solid var(--line);padding:1px 6px;font-size:10px;letter-spacing:.08em;margin-right:6px;color:var(--gold)}
    .tag.s{border-color:#5a2d2d;color:var(--red)}
    .nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
    .menu-btn{display:none;border:1px solid var(--gold);padding:6px 10px;color:var(--gold)}
    .axis{font-size:14px;line-height:1.7}
    .axis b{color:var(--gold2)}
    footer{margin-top:28px;color:var(--muted);font-size:12px;letter-spacing:.12em}
    @media(max-width:920px){.app{grid-template-columns:1fr}.side{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}nav{display:none}nav.open{display:flex}.menu-btn{display:inline-block}.grid-hero,.stats,.nums,.kv{grid-template-columns:1fr 1fr}}
    @media(max-width:640px){.main{padding:14px 12px 32px}.grid-hero,.stats,.nums,.kv{grid-template-columns:1fr}.scan{min-height:280px}.top h1{font-size:26px}}
  </style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand"><div class="mark">↑</div><div><small>ARCHIWUM</small><b>13 SAS</b></div></div>
  <button class="menu-btn" id="menuBtn">Węzły</button>
  <nav id="nav">
    <button data-view="pulpit" class="active"><small>01</small> Pulpit</button>
    <button data-view="porcelana"><small>02</small> Porcelana</button>
    <button data-view="index"><small>03</small> Master Index</button>
    <button data-view="sprzecznosci"><small>04</small> Sprzeczności</button>
    <button data-view="os"><small>05</small> Oś rodu</button>
    <button data-view="czytelnia"><small>06</small> Czytelnia</button>
    <button data-view="lumen"><small>07</small> LUMEN J28</button>
  </nav>
  <div class="lock"><b>REALITY LOCK</b>Źródło → model → działanie<br>0 zł · GitHub Pages · J28</div>
</aside>
<main class="main">
  <div class="top"><h1 id="title">Pulpit</h1><div class="online">● ONLINE · 12.09.2026</div></div>
  <div id="view"></div>
  <footer>RODOWE ARCHIWUM · KRESY · PRAWDA · J28 / BLACK INK 13</footer>
</main>
</div>
<script src="app.js"></script>
</body>
</html>
